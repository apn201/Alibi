[project]
name = "alibi-recorder"
version = "0.1"
description = "Alibi: record the Digitraffic AIS feed to disk, untouched."
requires-python = ">=3.11"
dependencies = ["paho-mqtt==2.1.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[project.scripts]
alibi-recorder = "alibi_recorder.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alibi_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
