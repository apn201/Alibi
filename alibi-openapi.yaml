openapi: 3.1.0
info:
  title: ALIBI Assessment API
  version: 1.0.0
  summary: Evidence-backed triage for unusual maritime events
  description: >-
    Accepts a candidate event from an AIS or maritime monitoring client and
    returns a structured assessment of what is unusual, what available evidence
    helps explain it, and what remains unexplained. An unexplained assessment is
    not a claim of hostile intent. ALIBI = Automatic Lookout for Irregular Baltic Itineraries.
    Two entry modes on the same call: event mode (the caller sends an event and
    its track) and track mode (a track without an event; ALIBI's reference
    detector finds the event). Every result records the API, model and profile
    versions and is written to an evidence ledger. This contract is also served
    at /api/v1/openapi.yaml; Swagger UI at /api/v1/docs.
servers:
  - url: http://127.0.0.1:8601/api/v1
    description: Local development (python -m alibi)
  - url: https://helppox.com/alibi/api/v1
    description: Hackathon deployment
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check service health
      responses:
        '200':
          description: Service is responding
          content:
            application/json:
              schema:
                type: object
                required: [status, api_version]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  api_version:
                    type: string
                  model_version:
                    type: string
                  profile_version:
                    type: string
                  dependencies:
                    type: object
                    description: profiles, ledger, envcache, explainers.
                    additionalProperties:
                      type: string
                      enum: [ok, degraded, unavailable, not_checked]
  /sources:
    get:
      operationId: listSources
      summary: List the evidence sources and their attribution
      description: >-
        Source ids usable in options.enabled_sources. `profile` is the
        baseline and always on. Kind `behaviour` sources may explain a
        deviation, `quality` only moves confidence, `identity` is shown and
        never changes Unusual or Unexplained.
      responses:
        '200':
          description: Source catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
  /assessments:
    post:
      operationId: createAssessment
      summary: Assess an unusual AIS event
      description: >-
        The caller may provide an event detected upstream, a track window, and
        optional metadata. The service records the configuration used and
        returns source-attributed findings. Missing data lowers confidence; it
        does not automatically increase suspicion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentRequest'
      responses:
        '200':
          description: Assessment completed synchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '202':
          description: Assessment accepted for asynchronous processing (optional future behaviour)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAccepted'
        '400':
          description: Invalid request, unsupported units or unknown source id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request payload exceeds configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Request is structurally valid but cannot be assessed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assessments/batch:
    post:
      operationId: createAssessmentBatch
      summary: Assess several requests under one set of options
      description: >-
        For clients that re-run a whole case under new toggles (sources,
        sensitivity). `options` overrides the given fields of every request's
        own options. Results come back in request order; a request that
        cannot be assessed yields a BatchError in its place. With
        persist false (default) nothing is written to the ledger and
        audit_reference is null. Body limit 25 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '200':
          description: One item per request
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/Assessment'
                    - $ref: '#/components/schemas/BatchError'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request payload exceeds configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assessments/{assessment_id}:
    get:
      operationId: getAssessment
      summary: Retrieve an assessment and its evidence
      parameters:
        - name: assessment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assessment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
        '404':
          description: Assessment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    AssessmentRequest:
      type: object
      required: [track]
      description: >-
        Event mode: an event detected upstream plus its track. Track mode: a
        track without an event; the service runs its reference detector over it
        and assesses what it finds, so upstream systems that flag nothing can
        still integrate.
      properties:
        event:
          $ref: '#/components/schemas/CandidateEvent'
        track:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/AisObservation'
        metadata:
          type: object
          description: Optional caller-provided metadata; preserve source attribution.
          additionalProperties: true
        options:
          $ref: '#/components/schemas/AssessmentOptions'
    CandidateEvent:
      type: object
      required: [event_id, event_type, start_time, end_time]
      properties:
        event_id:
          type: string
          description: Identifier assigned by the upstream detector.
        event_type:
          type: string
          description: For example slowdown, loitering, or route_deviation.
        vessel_id:
          type: string
          description: MMSI or another identifier, with identifier_type specified when ambiguous.
        identifier_type:
          type: string
          enum: [MMSI, IMO, other]
        start_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp; use UTC.
        end_time:
          type: string
          format: date-time
          description: ISO 8601 timestamp; use UTC.
        location:
          $ref: '#/components/schemas/GeoPoint'
        baseline_summary:
          type: object
          description: Optional baseline/detector context from the upstream tool.
          additionalProperties: true
    AisObservation:
      type: object
      required: [timestamp, latitude, longitude]
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp; use UTC.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        sog_knots:
          type: [number, 'null']
          minimum: 0
          description: Speed over ground in knots.
        cog_degrees:
          type: number
          minimum: 0
          maximum: 360
          description: Course over ground in degrees.
        heading_degrees:
          type: number
          minimum: 0
          maximum: 360
        nav_status:
          type: string
        pos_acc:
          type: boolean
          description: Position-accuracy flag, when supplied by the source.
        raim:
          type: boolean
          description: RAIM flag, when supplied by the source.
        source:
          type: string
          description: Input feed or archive identifier.
    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    AssessmentOptions:
      type: object
      properties:
        sensitivity:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
          description: >-
            Sensitivity s. An assessment is in the top band when Unexplained
            >= 0.75 - 0.5 s. In track mode s also sets the reference detector's
            thresholds (s = 0 conservative x0.7 rule only, s = 1 adds the
            4 sigma + 10 % rule and shorter windows).
        enabled_sources:
          type: array
          items:
            type: string
          description: Explicit source IDs to include in this run.
        include_evidence:
          type: boolean
          default: true
          description: When false, findings carry no details.
        include_signature:
          type: boolean
          default: true
          description: When false, the signature trace is omitted.
    BatchRequest:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          minItems: 1
          maxItems: 600
          items:
            $ref: '#/components/schemas/AssessmentRequest'
        options:
          $ref: '#/components/schemas/AssessmentOptions'
        persist:
          type: boolean
          default: false
          description: Record each result in the ledger.
    AssessmentAccepted:
      type: object
      required: [assessment_id, status]
      properties:
        assessment_id:
          type: string
        status:
          type: string
          enum: [queued, processing]
    Assessment:
      type: object
      required: [assessment_id, api_version, assessed_at, event, measures, confidence, findings, configuration, limitations]
      properties:
        assessment_id:
          type: string
        api_version:
          type: string
        assessed_at:
          type: string
          format: date-time
        headline:
          type: string
          description: >-
            One fixed sentence. The top band reads "Behaving unusually, and the
            available evidence does not explain it."
        event:
          $ref: '#/components/schemas/CandidateEvent'
        measures:
          type: object
          required: [unusual, unexplained]
          properties:
            unusual:
              type: [number, 'null']
              minimum: 0
              maximum: 1
              description: >-
                Deviation from the ship's expected speed (blend of own profile,
                class prototype and this journey); not a threat score. Null for
                working vessels (tug, pilot, SAR, pleasure, fishing, service),
                which are not scored. Measured per event type (details.unusual.measure):
                speed for slowdowns, gap length and displacement for ais_gap,
                minutes lingering against the place for corridor_loiter, the
                abrupt-stop fingerprint for grounding_pattern.
            unexplained:
              type: [number, 'null']
              minimum: 0
              maximum: 1
              description: >-
                Unusual x product over enabled behaviour sources of (1 - explains).
                Always <= unusual. Identity and quality sources never change it.
            band:
              type: string
              enum: [top, lower, not_scored]
            top_threshold:
              type: number
              description: 0.75 - 0.5 x sensitivity.
        confidence:
          type: object
          required: [level, reasons]
          properties:
            level:
              type: string
              enum: [low, medium, high]
            reasons:
              type: array
              items:
                type: string
        findings:
          type: array
          items:
            type: object
            required: [source_id, status, summary]
            properties:
              source_id:
                type: string
              status:
                type: string
                enum: [supports_explanation, weakens_explanation, neutral, unavailable, identity_context_only]
                description: >-
                  supports_explanation when explains >= 0.2; weakens_explanation when
                  the source was checked and points the other way (e.g. the fleet
                  kept its speed); unavailable when there is no data (lowers
                  confidence, never raises anything).
              summary:
                type: string
                description: One fixed, human-written sentence with numbers filled in.
              explains:
                type: [number, 'null']
                minimum: 0
                maximum: 1
                description: Share of the deviation this source accounts for (behaviour sources); null for identity.
              lamp:
                type: [string, 'null']
                enum: [WX, ICE, PLC, GNSS, TRF, null]
              observed_at:
                type: string
                format: date-time
              source_reference:
                type: string
              details:
                type: object
                additionalProperties: true
        configuration:
          type: object
          required: [sensitivity, enabled_sources, model_version, profile_version]
          properties:
            profile_version:
              type: string
              description: Profile snapshot used as the baseline (one per nightly build), so a re-run reproduces the result.
            detected_by:
              type: string
              enum: [upstream, reference_detector]
              description: Whether the event came from the caller or from the service's own detector (track mode).
            api_version:
              type: string
            sensitivity:
              type: number
              minimum: 0
              maximum: 1
            enabled_sources:
              type: array
              items:
                type: string
            model_version:
              type: string
        limitations:
          type: array
          items:
            type: string
        audit_reference:
          type: [string, 'null']
          description: Reference to the recorded input/configuration/evidence ledger, if enabled.
        vessel:
          type: object
          properties:
            vessel_key:
              type: [string, 'null']
              description: IMO<n> when the ship has an IMO number, else MMSI<n>.
            mmsi:
              type: [integer, 'null']
            imo:
              type: [integer, 'null']
            name:
              type: [string, 'null']
            cls:
              type: [string, 'null']
              description: Prototype class, type group / length class, e.g. cargo/L.
            profile_tier:
              type: string
              enum: [own, prototype, journey, working]
              description: Which profile dominates the expected speed; working = not scored.
        lamps:
          type: object
          description: >-
            One state per evidence lamp: WX sea_state, ICE ice, PLC place / own_habit /
            notices, GNSS position_quality, TRF fleet. For GNSS, not_explained means
            position-quality problems were found (confidence lowered).
          properties:
            WX: {$ref: '#/components/schemas/LampState'}
            ICE: {$ref: '#/components/schemas/LampState'}
            PLC: {$ref: '#/components/schemas/LampState'}
            GNSS: {$ref: '#/components/schemas/LampState'}
            TRF: {$ref: '#/components/schemas/LampState'}
        signature:
          $ref: '#/components/schemas/Signature'
        details:
          type: object
          additionalProperties: true
          description: >-
            unusual (expected, observed, sigma, blend weights), coverage, and in
            track mode the detector used and other_events found in the track.
    LampState:
      type: string
      enum: [explains, not_explained, neutral, unavailable]
    Signature:
      type: object
      description: >-
        Trace for the GUI over 1-minute steps of the submitted track; all arrays
        have equal length. Speeds in knots; band values are half-widths.
      required: [t, observed_kn, expected_profile_kn, band_profile_kn, expected_adjusted_kn, band_adjusted_kn, state, event_start, event_end]
      properties:
        t:
          type: array
          items: {type: string, format: date-time}
        observed_kn:
          type: array
          items: {type: [number, 'null']}
        expected_profile_kn:
          type: array
          items: {type: [number, 'null']}
        band_profile_kn:
          type: array
          items: {type: [number, 'null']}
        expected_adjusted_kn:
          type: array
          description: Profile expectation plus every enabled explainer's expected change.
          items: {type: [number, 'null']}
        band_adjusted_kn:
          type: array
          items: {type: [number, 'null']}
        state:
          type: array
          description: >-
            0 inside the profile band, 1 outside it but inside the adjusted band
            (unusual, explained), 2 outside the adjusted band (unexplained).
          items: {type: [integer, 'null'], enum: [0, 1, 2, null]}
        event_start:
          type: string
          format: date-time
        event_end:
          type: string
          format: date-time
    Source:
      type: object
      required: [id, title, kind, attribution]
      properties:
        id:
          type: string
          enum: [profile, sea_state, ice, own_habit, place, fleet, notices, position_quality, identity]
        title:
          type: string
        kind:
          type: string
          enum: [behaviour, quality, identity]
        lamp:
          type: [string, 'null']
        attribution:
          type: string
        available:
          type: boolean
          description: False when the source's module is not built into this deployment.
    BatchError:
      type: object
      required: [index, error, message]
      properties:
        index:
          type: integer
        error:
          type: string
        message:
          type: string
        details:
          type: [object, 'null']
          additionalProperties: true
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
