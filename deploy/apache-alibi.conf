# ALIBI under an existing Apache HTTPS vhost (helppox.com). Include inside the <VirtualHost *:443> block.
# Needs: mod_alias, mod_proxy, mod_proxy_http, mod_headers.
#
#   /alibi/            GUI (static, detector/web)
#   /alibi/cases/      replay cases (static JSON from the deploy bundle)
#   /alibi/api/v1/     ALIBI API, reverse-proxied to the service on 127.0.0.1:8601

<Location /alibi/api/>
    ProxyPass        http://127.0.0.1:8601/api/ timeout=60
    ProxyPassReverse http://127.0.0.1:8601/api/
    # Assessment requests carry a track; 5 MB is plenty (the service also refuses larger with 413).
    LimitRequestBody 5242880
    Header set Cache-Control "no-store"
</Location>

Alias /alibi/cases/ /opt/alibi/app/data/cases/
<Directory /opt/alibi/app/data/cases/>
    Require all granted
    Options -Indexes
    Header set Cache-Control "max-age=300"
</Directory>

Alias /alibi/ /opt/alibi/app/detector/web/
<Directory /opt/alibi/app/detector/web/>
    Require all granted
    Options -Indexes
    DirectoryIndex index.html
</Directory>

RedirectMatch 301 ^/alibi$ /alibi/
