# ALIBI under an existing Apache HTTPS vhost (helppox.com). Include inside the <VirtualHost *:443> block.
# Needs: mod_proxy, mod_proxy_http, mod_headers.
#
#   /alibi/api/v1/   ALIBI API          -> 127.0.0.1:8601 (alibi-api.service)
#   /alibi/          GUI + replay cases -> 127.0.0.1:8600 (alibi-gui.service, merges snapshot and live cases)

<Location /alibi/api/>
    ProxyPass        http://127.0.0.1:8601/api/ timeout=120
    ProxyPassReverse http://127.0.0.1:8601/api/
    # A whole replay case goes to the batch endpoint in one request; the service refuses more than 25 MB itself.
    LimitRequestBody 26214400
    Header set Cache-Control "no-store"
</Location>

<Location /alibi/>
    ProxyPass        http://127.0.0.1:8600/ timeout=60
    ProxyPassReverse http://127.0.0.1:8600/
</Location>

RedirectMatch 301 ^/alibi$ /alibi/
